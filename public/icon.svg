<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square / Safe Zone -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#4338ca" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Kazakhstan Golden Sun/Eagle Inspired Chevron & Growth Orbit -->
  <!-- Geometric Growth Arrows & Neural Node Network -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Circuit lines -->
    <path d="M 64 256 L 192 128 L 320 256 L 448 128" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 192 384 L 320 256 L 448 384" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7" />
    
    <!-- Central Steppe Sun disk -->
    <circle cx="256" cy="180" r="48" fill="url(#accent)" />
    
    <!-- Growth Bars -->
    <rect x="100" y="320" width="36" height="100" rx="18" fill="#38bdf8" fill-opacity="0.9" />
    <rect x="170" y="270" width="36" height="150" rx="18" fill="#6366f1" fill-opacity="0.9" />
    <rect x="240" y="220" width="36" height="200" rx="18" fill="#818cf8" />
    <rect x="310" y="160" width="36" height="260" rx="18" fill="#a855f7" />
    <rect x="380" y="100" width="36" height="320" rx="18" fill="#c084fc" />
  </g>
  
  <!-- Kazakhstan Sun Rays Accent Symbol -->
  <circle cx="256" cy="120" r="16" fill="#facc15" />
</svg>
